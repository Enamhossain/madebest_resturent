    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://madebestresturent.vercel.app" />
    <link rel="preconnect" href="https://i.ibb.co" crossorigin />
    <link rel="dns-prefetch" href="https://madebestresturent.vercel.app" />
    <link rel="dns-prefetch" href="https://i.ibb.co" />

    <!-- Preload/modulepreload for source files removed to avoid MIME/404 in production -->

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#f97316" />
    
    <!-- Apple specific meta tags -->
    <meta name="mobile-web-app-capable" content="yes">

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Critical CSS inline for faster rendering -->
    <style>
      /* Premium Initial Loader */
      html, body { 
        margin: 0; 
        padding: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
      }
      html.loading-active, body.loading-active {
        overflow: hidden !important;
        height: 100vh;
      }
      .loading { 
        position: fixed;
        inset: 0;
        display: flex; 
        justify-content: center; 
        align-items: center; 
        z-index: 99999;
        background: radial-gradient(circle at center, #ffffff 0%, #fff7ed 100%);
      }
      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }
      .loader-visual {
        position: relative;
        width: 120px;
        height: 120px;
      }
      .loader-ring {
        position: absolute;
        inset: 0;
        border: 2px solid transparent;
        border-top-color: #f97316;
        border-radius: 50%;
        animation: loader-spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      .loader-ring:nth-child(2) {
        inset: 10px;
        border-top-color: #fbbf24;
        animation-duration: 1.5s;
        animation-direction: reverse;
      }
      .loader-ring:nth-child(3) {
        inset: 20px;
        border-top-color: #ea580c;
        animation-duration: 0.8s;
      }
      .loader-logo {
        position: absolute;
        inset: 30px;
        background: #ffffff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(249, 115, 22, 0.1);
        z-index: 2;
      }
      .loader-logo svg {
        width: 32px;
        height: 32px;
        fill: #f97316;
        animation: loader-pulse 2s ease-in-out infinite;
      }
      .loader-text {
        text-align: center;
      }
      .loader-title {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: -0.05em;
        color: #1c1917;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .loader-title span { color: #f97316; font-style: italic; }
      .loader-progress {
        width: 180px;
        height: 4px;
        background: #fed7aa;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 16px;
      }
      .loader-bar {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #f97316, #fbbf24, #f97316);
        background-size: 200% 100%;
        border-radius: 10px;
        animation: loader-progress-anim 2s infinite linear, loader-shimmer 1.5s infinite linear;
      }
      @keyframes loader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes loader-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.9); opacity: 0.8; }
      }
      @keyframes loader-progress-anim {
        0% { width: 0%; margin-left: 0%; }
        50% { width: 60%; margin-left: 20%; }
        100% { width: 0%; margin-left: 100%; }
      }
      @keyframes loader-shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      /* Prevent layout shift */
      img { max-width: 100%; height: auto; }
    </style>
    
    <title>MadeBest Restaurant | Gourmet Dining & Exclusive Experiences</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Indulge in culinary excellence at MadeBest Restaurant. We offer gourmet dining, private dining experiences, and professional corporate catering in Dhaka." />
    <meta name="keywords" content="gourmet restaurant dhaka, private dining dhaka, corporate catering, best food delivery dhaka, madebest restaurant" />
    <meta name="image" content="https://i.ibb.co/VNs4X6g/1705932001959oh7xa24u-removebg-preview.png" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://madebestresturent.vercel.app/" />
    <meta property="og:title" content="MadeBest Restaurant | Gourmet Dining" />
    <meta property="og:description" content="Experience the art of fire-grilled perfection and artisan culinary delights." />
    <meta property="og:image" content="https://i.ibb.co/VNs4X6g/1705932001959oh7xa24u-removebg-preview.png" />

  </head>
  <body>
    <div id="root">
      <!-- Premium Initial Loader -->
      <div class="loading">
        <div class="loading-container">
          <div class="loader-visual">

    <!-- Service Worker Registration - Optimized -->
    <script>
      if ('serviceWorker' in navigator) {
        // Register immediately, don't wait for load
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then((registration) => {
            // Check for updates periodically
            setInterval(() => {
              registration.update();
            }, 60 * 60 * 1000); // Check every hour
          })
          .catch(() => {
            // Silent fail - service worker is optional
          });
      }
      
      // Preload critical resources
      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => {
          const link = document.createElement('link');
          link.rel = 'prefetch';
          link.href = '/ourmenu';
          document.head.appendChild(link);
        });
      }
    </script>
  </body>
